[build-system]
requires = ["setuptools>=77.0", "setuptools_scm>=8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "check-zenodo-json"
authors = [
  { name="Toon Verstraelen", email="toon.verstraelen@ugent.be" },
]
description = "Check the validity of Zenodo JSON files"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/*"]
requires-python = ">=3.10"
dependencies = ["check-jsonschema>=0.38,<1"]
dynamic = ["version"]
keywords = ["zenodo", "json", "schema", "pre-commit", "validation", "metadata"]

[project.urls]
Repository = "https://github.com/reproducible-reporting/check-zenodo-json"
Issues = "https://github.com/reproducible-reporting/check-zenodo-json/issues"

[project.scripts]
check-zenodo-json = "check_zenodo_json.__main__:main"

[project.optional-dependencies]
dev = [
    "jsonschema",
    "pre-commit",
    "pytest",
    "reuse",
]

[tool.setuptools]
packages = ["check_zenodo_json"]

[tool.setuptools.package-data]
check_zenodo_json = ["zenodo-derived-legacy-deposit.schema.json"]

[tool.setuptools_scm]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "A", "B", "BLE", "C4", "E", "EXE", "F", "I", "ICN", "ISC", "N", "NPY", "PERF", "PIE", "PL",
    "PT", "PYI", "RET", "RSE", "RUF", "SIM", "TRY", "UP", "W"
]
ignore = [
    # Fires on any `raise SomeError("a message")`, which is the style used here.
    "TRY003",  # https://docs.astral.sh/ruff/rules/raise-vanilla-args/
    # Fires on the literals a test asserts against.
    "PLR2004",  # https://docs.astral.sh/ruff/rules/magic-value-comparison/
]

[tool.pymarkdown]
plugins.MD013.line_length = 100
# The changelog repeats a subheading such as "Fixed" under every release.
plugins.MD024.siblings_only = true
